# Dependabot version updates.
# Security updates are enabled separately in the repository settings
# and are not affected by the cooldown below.

version: 2
updates:
  # npm packages (package.json and package-lock.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Only propose versions published at least 14 days ago
    cooldown:
      default-days: 14
    # One weekly PR for minor and patch bumps, separate PRs for majors
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        # 0.x package: a minor bump may break the API, so it always gets its own PR
        exclude-patterns:
          - "@anthropic-ai/sdk"
    ignore:
      # Types must match the Node.js runtime (24 in the Dockerfile), bumped by hand with it
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  # Docker base image (node:24-alpine in the Dockerfile)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    ignore:
      # Stay on the current LTS line; odd majors never become LTS. Move to the next LTS by hand.
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
